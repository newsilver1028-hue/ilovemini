name: ilovemini
publish_to: 'none'
description: ILOVEMINI owner app
version: 1.0.0+362
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.14.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  app_links: ^6.4.1
  url_launcher: ^6.3.1
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.2
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  local_auth: ^2.3.0
  package_info_plus: ^9.0.1
  sign_in_with_apple: ^8.2.0
  image_picker: ^1.2.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mini-album/
    - assets/images/season/
    - assets/images/mini-vehicles/
    - assets/images/bmw-vehicles/
    - assets/images/mini-recommended-items/
