name: ilovemini
publish_to: 'none'
description: ILOVEMINI owner app
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  app_links: ^6.4.1
  url_launcher: ^6.3.1
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.2
  firebase_app_installations: ^0.4.2
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/ilovemini_logo.png
    - assets/images/mini_f66_favoured_red.png
    - assets/images/partner-banner-kumho.webp
    - assets/images/partner-banner-deutsch.webp
    - assets/images/partner-banner-printtrap.webp
    - assets/images/partner-banner-greeting.webp
    - assets/images/maybach-s580-front.webp
    - assets/images/mini-album/
